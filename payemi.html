<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Enter your PAN card number to view available loan options from Vridora Capital.">
  <title>Pay EMI | Vridora Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #19312d; --muted: #61716c; --paper: #f7f6f1; --lime: #bde65d; --blue: #0876d1; --line: rgba(25,49,45,.16); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font-family: 'DM Sans', sans-serif; }
    .payemi-card { position: relative; width: min(100%, 470px); padding: 25px 24px 27px; background: #fff; border-radius: 0 0 12px 12px; box-shadow: 0 16px 40px rgba(25,49,45,.14); }
    .close-link { position: absolute; top: 17px; right: 18px; color: #65717e; font-size: 26px; line-height: 1; text-decoration: none; }
    .payemi-icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; background: #e8f4ff; color: var(--blue); font-size: 34px; }
    h1 { margin: 0; color: #202985; text-align: center; font: 700 24px 'Space Grotesk', sans-serif; }
    .intro { margin: 10px 0 26px; color: #5f6c7d; text-align: center; font-size: 16px; }
    label { display: block; margin-bottom: 8px; color: #435064; font-size: 14px; font-weight: 600; }
    input { width: 100%; min-height: 51px; border: 1px solid #cbd3dd; border-radius: 6px; padding: 0 13px; color: var(--ink); font: 16px 'DM Sans', sans-serif; outline: 0; }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(8,118,209,.13); }
    input::placeholder { color: #98a4b3; }
    .field-note { margin: 5px 0 31px; color: #6e7b8d; font-size: 12px; }
    .submit-button { width: 100%; min-height: 48px; border: 0; border-radius: 6px; background: var(--blue); color: #fff; font: 700 16px 'DM Sans', sans-serif; cursor: pointer; }
    .submit-button:hover { background: #0865b2; }
    .submit-button span { margin-left: 8px; font-size: 22px; vertical-align: -1px; }
    .security-note { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 22px; padding-top: 17px; border-top: 1px solid var(--line); color: #6e7785; font-size: 12px; }
    .security-note span { color: #65717e; font-size: 18px; }
    .form-message { min-height: 18px; margin-top: 10px; color: #bd604e; text-align: center; font-size: 12px; }
    @media (max-width: 480px) { body { padding: 0; align-items: start; } .payemi-card { min-height: 100vh; padding: 25px 23px; border-radius: 0; } }
  </style>
</head>
<body>
  <main class="payemi-card" aria-labelledby="payemi-title">
    <a class="close-link" href="/" aria-label="Close Pay EMI page">×</a>
    <div class="payemi-icon" aria-hidden="true">▧</div>
    <h1 id="payemi-title">Enter PAN</h1>
    <p class="intro">Enter your PAN card number to view available loans</p>
    <form id="pan-form" novalidate>
      <label for="pan-number">PAN Card Number *</label>
      <input id="pan-number" name="pan" type="text" inputmode="text" maxlength="10" autocomplete="off" placeholder="ABCDE1234F" aria-describedby="pan-help pan-message" required>
      <p class="field-note" id="pan-help">Enter your 10-character PAN number (Format: ABCDE1234F)</p>
      <button class="submit-button" type="submit">Get Available Loans <span aria-hidden="true">→</span></button>
      <div class="form-message" id="pan-message" role="status" aria-live="polite"></div>
    </form>
    <div class="security-note"><span aria-hidden="true">♧</span> Secured by SSL encryption</div>
  </main>
  <script>
    const panForm = document.querySelector('#pan-form');
    const panInput = document.querySelector('#pan-number');
    const panMessage = document.querySelector('#pan-message');

    panInput.addEventListener('input', () => {
      panInput.value = panInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      panMessage.textContent = '';
    });

    panForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const pan = panInput.value.trim();
      if (!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan)) {
        panMessage.textContent = 'Please enter a valid 10-character PAN number.';
        panInput.focus();
        return;
      }
      panMessage.textContent = 'PAN verified. Available loan options will appear shortly.';
    });
  </script>
</body>
</html>
